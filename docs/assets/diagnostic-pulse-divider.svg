<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 32" width="1200" height="32" fill="none" role="img" aria-label="CoreSense Signal Divider">
  <defs>
    <linearGradient id="divLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22262B" stop-opacity="0"/>
      <stop offset="20%" stop-color="#2556B8" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#5EC6A8" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#E5B567" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#22262B" stop-opacity="0"/>
    </linearGradient>
    <style>
      .pulse-beam { stroke-dasharray: 85 1120; animation: pulseTravel 4.2s linear infinite; }
      @keyframes pulseTravel {
        0% { stroke-dashoffset: 1205; }
        100% { stroke-dashoffset: 0; }
      }
    </style>
  </defs>
  <path d="M 10 16 H 548 L 560 6 L 572 26 L 584 10 L 594 16 H 1190" stroke="url(#divLine)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 10 16 H 548 L 560 6 L 572 26 L 584 10 L 594 16 H 1190" stroke="#7BA7F7" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" class="pulse-beam"/>
  <circle r="3.2" fill="#5EC6A8">
    <animateMotion dur="4.2s" repeatCount="indefinite" path="M 10 16 H 548 L 560 6 L 572 26 L 584 10 L 594 16 H 1190"/>
  </circle>
</svg>
