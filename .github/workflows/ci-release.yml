name: CoreSense CI & Commercial Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Build & Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm --workspace @coresense/mobile run build
      - run: npm test

  release-desktop:
    name: Build Signed Desktop Installers (${{ matrix.platform }})
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: nsis,msi
          - platform: macos-latest
            bundles: app,dmg
          - platform: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux WebKitGTK dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm --workspace @coresense/shared run build
      - name: Build Signed Tauri v2 Bundles & Updater Artifacts
        working-directory: apps/desktop
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: coresense-desktop-${{ matrix.platform }}
          path: apps/desktop/src-tauri/target/release/bundle/**/*

  assemble-updater-release:
    name: Assemble Signed Updater Manifest (latest.json) & Publish
    needs: release-desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: raw-artifacts
      - name: Collect Installers & Generate Signed latest.json
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const tag = process.env.TAG_NAME;
            const version = tag.replace(/^v/, "");
            const outDir = "release-assets";
            fs.mkdirSync(outDir, { recursive: true });

            function walk(dir, out = []) {
              if (!fs.existsSync(dir)) return out;
              for (const ent of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, ent.name);
                if (ent.isDirectory()) walk(full, out);
                else out.push(full);
              }
              return out;
            }

            const files = walk("raw-artifacts");
            const copied = [];
            for (const f of files) {
              const name = path.basename(f);
              if (/\.(exe|msi|dmg|deb|AppImage|tar\.gz|sig)$/i.test(name)) {
                const dest = path.join(outDir, name);
                fs.copyFileSync(f, dest);
                copied.push(name);
              }
            }

            const baseUrl = `https://github.com/hrdk6/CoreSense-Releases/releases/download/${tag}`;
            const platforms = {};

            const findSigned = (pattern) => {
              const bin = copied.find((n) => pattern.test(n) && !n.endsWith(".sig"));
              if (!bin) return null;
              const sigName = `${bin}.sig`;
              const sigPath = path.join(outDir, sigName);
              if (!fs.existsSync(sigPath)) return null;
              return {
                signature: fs.readFileSync(sigPath, "utf8").trim(),
                url: `${baseUrl}/${encodeURIComponent(bin)}`,
              };
            };

            const win = findSigned(/-setup\.exe$/i);
            if (win) platforms["windows-x86_64"] = win;

            const mac = findSigned(/\.app\.tar\.gz$/i);
            if (mac) {
              platforms["darwin-aarch64"] = mac;
              platforms["darwin-x86_64"] = mac;
            }

            const linux = findSigned(/\.AppImage$/i);
            if (linux) platforms["linux-x86_64"] = linux;

            const manifest = {
              version,
              notes: `CoreSense ${tag} — Signed 1-Click Desktop Auto-Updates, Hybrid Vector RAG (768d gemini-embedding-2), Real-Time SSE Streaming Gemini 4 Copilot, Full Hardware Diagnostics, and AI/ML Evaluation Lab.`,
              pub_date: new Date().toISOString(),
              platforms,
            };

            fs.writeFileSync(path.join(outDir, "latest.json"), JSON.stringify(manifest, null, 2));
            console.log("Generated latest.json:", JSON.stringify(manifest, null, 2));
            console.log("Total release assets:", fs.readdirSync(outDir));
          '
      - uses: actions/upload-artifact@v4
        with:
          name: coresense-release-bundle-${{ github.ref_name }}
          path: release-assets/*
      - name: Publish Binaries & Signed latest.json to Public Binaries-Only Release Repo
        if: env.RELEASE_REPO_TOKEN != ''
        env:
          RELEASE_REPO_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        uses: softprops/action-gh-release@v2
        with:
          repository: hrdk6/CoreSense-Releases
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          generate_release_notes: false
          files: release-assets/*
